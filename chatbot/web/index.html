<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The House of Hem — Shopping Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..500&family=Jost:wght@400;500&display=swap" rel="stylesheet" />
    <style>
        :root {
            --ink: #141213;
            --ink-soft: #3D3839;
            --muted: #6C6466;
            --line: #E6E0DC;
            --cream: #FAF7F4;
            --cream-deep: #F1ECE8;
            --rose-deep: #A9506A;
            --rose-wash: #F6E4E7;
            color-scheme: light;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Jost', system-ui, sans-serif;
            background: var(--cream);
            color: var(--ink);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header { text-align: center; padding: 2rem 1rem .75rem; }
        .kicker { font-size: .72rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
        header h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 340; font-size: 2rem; margin-top: .35rem; }
        header p { color: var(--muted); font-size: .95rem; margin-top: .3rem; }

        .chat {
            width: min(34rem, calc(100% - 2rem));
            height: min(44rem, calc(100vh - 9rem));
            display: flex;
            flex-direction: column;
            background: #fff;
            border: 1px solid var(--line);
            margin: .5rem 1rem 1.5rem;
        }

        .messages { flex: 1; padding: 1.25rem; overflow-y: auto; }

        .hints { display: flex; flex-wrap: wrap; gap: .4rem; margin-bottom: 1rem; }
        .hint { border: 1px solid var(--line); background: var(--cream); padding: .4rem .75rem; font: inherit; font-size: .85rem; cursor: pointer; }
        .hint:hover { border-color: var(--ink); }

        .message { margin-bottom: .9rem; display: flex; flex-direction: column; }
        .message-user { align-items: flex-end; }
        .message-bot { align-items: flex-start; }
        .bubble { max-width: 85%; padding: .6rem .85rem; line-height: 1.5; font-size: .95rem; }
        .message-user .bubble { background: var(--ink); color: #fff; }
        .message-bot .bubble { background: var(--cream-deep); }
        .via { font-size: .72rem; color: var(--muted); margin-top: .25rem; letter-spacing: .04em; }
        .upload-thumb { width: 9rem; aspect-ratio: 3 / 4; object-fit: cover; border: 1px solid var(--line); }
        .typing { font-size: .85rem; color: var(--muted); }

        .products { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin-top: .6rem; width: 100%; }
        .product { border: 1px solid var(--line); background: #fff; color: inherit; text-decoration: none; display: block; transition: border-color .15s; }
        .product:hover { border-color: var(--ink); }
        .product:hover .view { color: var(--rose-deep); }
        .product .view { font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: .3rem; }
        .product img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; background: var(--cream-deep); }
        .product div { padding: .45rem .55rem .55rem; }
        .product p { font-size: .78rem; line-height: 1.35; }
        @media (max-width: 30rem) { .products { grid-template-columns: repeat(2, 1fr); } }
        .product .price { color: var(--muted); margin-top: .1rem; }

        .composer { border-top: 1px solid var(--line); padding: .75rem; }
        .row { display: flex; gap: .5rem; align-items: center; }
        .row input[type=text] {
            flex: 1; min-width: 0; padding: .7rem .85rem; border: 1px solid var(--line);
            font: inherit; font-size: .95rem; outline: none;
        }
        .row input[type=text]:focus { border-color: var(--ink); }
        .icon-btn {
            width: 2.75rem; height: 2.75rem; flex: none; display: grid; place-items: center;
            border: 1px solid var(--line); background: #fff; cursor: pointer; color: var(--ink);
        }
        .icon-btn:hover { border-color: var(--ink); }
        .icon-btn.recording { background: var(--rose-deep); border-color: var(--rose-deep); color: #fff; animation: pulse 1.2s ease-in-out infinite; }
        @keyframes pulse { 50% { box-shadow: 0 0 0 6px var(--rose-wash); } }
        @media (prefers-reduced-motion: reduce) { .icon-btn.recording { animation: none; } }
        .send {
            height: 2.75rem; padding: 0 1.1rem; border: none; background: var(--ink); color: #fff; cursor: pointer;
            font: inherit; font-size: .78rem; letter-spacing: .14em; text-transform: uppercase;
        }
        .send:hover { background: var(--rose-deep); }
        button:disabled { opacity: .45; cursor: default; }
        .status { font-size: .8rem; color: var(--rose-deep); min-height: 1.1rem; margin-top: .45rem; }
        .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
        :focus-visible { outline: 2px solid var(--rose-deep); outline-offset: 2px; }
    </style>
</head>

<body>
    <header>
        <p class="kicker">The House of Hem</p>
        <h1>Shopping assistant</h1>
        <p>Type, speak, or share a photo of something you like.</p>
    </header>

    <div class="chat">
        <div class="messages" id="messages" aria-live="polite"></div>
        <form class="composer" id="form">
            <div class="row">
                <button type="button" class="icon-btn" id="photoBtn" title="Find lookalikes from a photo" aria-label="Search with a photo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="1"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
                </button>
                <input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp" class="sr-only" tabindex="-1" />
                <button type="button" class="icon-btn" id="micBtn" title="Ask with your voice" aria-label="Start voice input" aria-pressed="false">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
                </button>
                <label class="sr-only" for="input">Message</label>
                <input id="input" type="text" placeholder="e.g. men's shirts under 2000" autocomplete="off" />
                <button class="send" id="send" type="submit">Send</button>
            </div>
            <p class="status" id="status"></p>
        </form>
    </div>

    <script type="module" src="/app.js"></script>
</body>

</html>
